<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#0D2B6E"></rect>
      <rect width="4" height="8" fill="#0a2358"></rect>
    </pattern>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D2B6E" stop-opacity="0.2"></stop>
      <stop offset="1" stop-color="#080C14" stop-opacity="0.7"></stop>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#stripes)"></rect>
  <rect width="800" height="600" fill="url(#g)"></rect>
</svg>